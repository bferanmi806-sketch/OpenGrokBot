<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0c0f19" />
    <meta name="referrer" content="no-referrer" />
    <title>OpenSuperBot</title>
    <script>
      (function () {
        try {
          var t = localStorage.getItem('osb_theme');
          var r = t === 'light' ? 'light'
            : t === 'system' && window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light'
            : 'dark';
          document.documentElement.dataset.theme = r;
          var mc = document.querySelector('meta[name="theme-color"]');
          if (mc) mc.setAttribute('content', r === 'light' ? '#f6f7f9' : '#0c0f19');
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
