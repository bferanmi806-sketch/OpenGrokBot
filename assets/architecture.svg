<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 620" width="960" height="620" role="img"
     aria-label="OpenSuperBot v0.8 architecture: the desktop app or browser talks to one gateway process on 127.0.0.1:4747 with Host and Sec-Fetch-Site guards, keeping Today workspaces, Team Wiki, Credential Vault, team.md charters, approvals, rules, MCP and Polery OAuth tokens, and tamper-evident MEMORY.md outside bot computers, connecting each teammate to its own AI model with a local P0-P3 priority queue and gated connectors or MCP servers, and driving one isolated Docker container or local browser+sandbox per teammate.">
  <defs>
    <style>
      .bg    { fill: #0d0d0d; }
      .card  { fill: #1a1a1a; stroke: #343434; stroke-width: 1; }
      .panel { fill: #141414; stroke: #333333; stroke-width: 1; }
      .ghost { fill: #131313; stroke: #262626; stroke-width: 1; }
      .pill  { fill: #202020; stroke: #2e2e2e; stroke-width: 1; }
      .t     { fill: #ededed; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .dim   { fill: #8f8f8f; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .faint { fill: #7c7c7c; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .blue  { fill: #4d9fff; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      .mono  { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
      .b     { font-weight: 600; }
      .flow  { stroke: #4a4a4a; stroke-width: 1.5; fill: none; }
      .dash  { stroke: #4a4a4a; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
      .take  { stroke: #4d9fff; stroke-width: 1.5; fill: none; stroke-dasharray: 5 4; }
    </style>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4a4a4a"/>
    </marker>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#4d9fff"/>
    </marker>
  </defs>

  <rect class="bg" x="0" y="0" width="960" height="620"/>

  <!-- You -->
  <rect class="card" x="210" y="22" width="300" height="54" rx="10"/>
  <text class="t b" x="360" y="45" font-size="14" text-anchor="middle">You</text>
  <text class="dim mono" x="360" y="63" font-size="10.5" text-anchor="middle">desktop app or browser · Today &amp; Threads</text>

  <path class="flow" d="M360,76 L360,118" marker-end="url(#a)"/>
  <text class="faint" x="372" y="101" font-size="11">REST + WebSocket + screen proxy · Host/CSRF guard</text>

  <!-- Model provider -->
  <rect class="card" x="706" y="118" width="224" height="86" rx="10"/>
  <text class="t b" x="818" y="140" font-size="13" text-anchor="middle">Per-teammate AI</text>
  <text class="dim mono" x="818" y="159" font-size="10" text-anchor="middle">Claude · OpenAI · Gemini · Grok</text>
  <text class="dim mono" x="818" y="174" font-size="10" text-anchor="middle">DeepSeek · Kimi · Qwen · Ollama</text>
  <text class="faint mono" x="818" y="191" font-size="9.5" text-anchor="middle">BYOK · local P0–P3 priority queue</text>
  <path class="dash" d="M664,160 L700,160" marker-end="url(#a)"/>
  <text class="faint mono" x="682" y="150" font-size="10" text-anchor="middle">BYOK</text>

  <!-- Connectors & MCP -->
  <rect class="card" x="706" y="214" width="224" height="90" rx="10"/>
  <text class="t b" x="818" y="236" font-size="13" text-anchor="middle">Connectors &amp; MCP</text>
  <text class="dim mono" x="818" y="255" font-size="9.5" text-anchor="middle">Polery (OAuth 2.1) · Gmail · Slack</text>
  <text class="dim mono" x="818" y="271" font-size="9.5" text-anchor="middle">Outlook · Calendar · Notion · MCP</text>
  <text class="faint mono" x="818" y="288" font-size="9.5" text-anchor="middle">stdio / HTTP · taint &amp; write gate</text>
  <path class="dash" d="M664,248 L700,248" marker-end="url(#a)"/>
  <text class="faint mono" x="682" y="238" font-size="10" text-anchor="middle">gated</text>

  <!-- Gateway -->
  <rect class="panel" x="60" y="124" width="600" height="154" rx="12"/>
  <text class="t b" x="80" y="151" font-size="14">Gateway</text>
  <text class="faint mono" x="152" y="151" font-size="11">one Node process · 127.0.0.1:4747 · your machine</text>

  <rect class="pill" x="76" y="168" width="104" height="62" rx="8"/>
  <text class="t" x="128" y="193" font-size="11.5" text-anchor="middle">Agent + lane</text>
  <text class="faint" x="128" y="211" font-size="9" text-anchor="middle">guardrails · bg tasks</text>

  <rect class="pill" x="192" y="168" width="104" height="62" rx="8"/>
  <text class="t" x="244" y="193" font-size="11.5" text-anchor="middle">SQLite + data</text>
  <text class="faint" x="244" y="211" font-size="9" text-anchor="middle">Wiki · Vault · MEMORY</text>

  <rect class="pill" x="308" y="168" width="104" height="62" rx="8"/>
  <text class="t" x="360" y="193" font-size="11.5" text-anchor="middle">Today + cron</text>
  <text class="faint" x="360" y="211" font-size="9" text-anchor="middle">Feed · Spaces · Quiet</text>

  <rect class="pill" x="424" y="168" width="104" height="62" rx="8"/>
  <text class="t" x="476" y="193" font-size="11.5" text-anchor="middle">Groups + DAG</text>
  <text class="faint" x="476" y="211" font-size="9" text-anchor="middle">team.md · pipelines</text>

  <rect class="pill" x="540" y="168" width="104" height="62" rx="8"/>
  <text class="t" x="592" y="193" font-size="11.5" text-anchor="middle">Computer pool</text>
  <text class="faint" x="592" y="211" font-size="9" text-anchor="middle">Docker · local · lease</text>

  <text class="faint" x="80" y="256" font-size="10.5">SOUL, MEMORY, Wiki, team.md, Vault, MCP &amp; Polery tokens stay in &lt;data&gt; (0600) outside every bot.</text>

  <path class="flow" d="M360,278 L360,316" marker-end="url(#a)"/>
  <text class="faint mono" x="372" y="301" font-size="10">CDP + shim / OS sandbox</text>

  <!-- Bot computers: two ghosts behind to say "one per teammate" -->
  <rect class="ghost" x="84" y="346" width="540" height="214" rx="12"/>
  <rect class="ghost" x="72" y="334" width="540" height="214" rx="12"/>
  <rect class="card"  x="60" y="322" width="540" height="214" rx="12"/>

  <text class="t b mono" x="80" y="351" font-size="13">Each teammate's computer</text>
  <text class="faint" x="80" y="369" font-size="11">sealed Docker container (opensuperbot-&lt;bot&gt;)  ·  or zero-Docker local sandbox</text>

  <circle cx="86" cy="400" r="3" fill="#4ec26f"/>
  <text class="t" x="100" y="404" font-size="12">Chromium — dedicated profile per teammate (logins + fg/bg lease)</text>
  <text class="dim mono" x="580" y="404" font-size="11" text-anchor="end">CDP</text>

  <circle cx="86" cy="432" r="3" fill="#4d9fff"/>
  <text class="t" x="100" y="436" font-size="12">Live screen — noVNC (Docker) or CDP screencast + sign-in window</text>
  <text class="dim mono" x="580" y="436" font-size="11" text-anchor="end">via :4747</text>

  <circle cx="86" cy="464" r="3" fill="#d9a441"/>
  <text class="t" x="100" y="468" font-size="12">Commands — container shim, or opt-in Seatbelt / bubblewrap</text>
  <text class="dim mono" x="580" y="468" font-size="11" text-anchor="end">isolated</text>

  <circle cx="86" cy="500" r="3" fill="#8f8f8f"/>
  <text class="t" x="100" y="504" font-size="12">/workspace</text>
  <text class="faint mono" x="100" y="521" font-size="10">working files, oversized tool spills, and copies of attachments you sent it</text>

  <!-- Takeover path: proxied through the gateway -->
  <path class="take" d="M644,278 L644,436 L606,436" marker-end="url(#ab)"/>
  <text class="blue" x="660" y="388" font-size="11">watch live or take over</text>
  <text class="blue" x="660" y="404" font-size="11">to sign in once</text>

  <!-- Footer -->
  <path d="M60,570 L930,570" stroke="#262626" stroke-width="1"/>
  <text class="faint" x="60" y="592" font-size="11">Every port binds to 127.0.0.1 with Host/Sec-Fetch-Site guards. Vault, MCP &amp; Polery secrets stay in &lt;data&gt; (0600).</text>
  <text class="faint" x="60" y="608" font-size="11">Connector, MCP &amp; Vault writes are code-gated with inline editing &amp; frozen args; peer handoffs stay off until allowlisted.</text>
</svg>
